# Settings de pnpm (pnpm 11 movió esta config acá desde package.json).
# Decidimos explícitamente qué dependencias pueden correr build scripts
# (postinstall). Las de testcontainers (cpu-features/ssh2/protobufjs) son
# opcionales con fallback en JS y se omiten.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Overrides de seguridad: forzamos versiones parcheadas en dependencias
# TRANSITIVAS (tooling de build/dev, no runtime). Ver `pnpm audit`.
#  - postcss: XSS en stringify (GHSA-qx2v-qp2m-jg93) — llega vía next (build).
#  - esbuild: integridad de binario / dev-server (GHSA-67mh-4wv8-2f99) — vía drizzle-kit.
#  - undici: bypass de validación de cert TLS + DoS del cliente WebSocket + header
#    injection (GHSA-p88m-4jfj-68fv y otros) — llega vía testcontainers (solo tests).
#  - brace-expansion / js-yaml: DoS por expansión exponencial y por merge-keys —
#    llegan vía eslint y testcontainers (tooling).
#  - sharp: vulnerabilidades heredadas de libvips — llega vía next (opcional).
#  - protobufjs: DoS por loop infinito — vía testcontainers.
#  - browserslist / nanoid / baseline-browser-mapping: DoS y crash por input
#    malicioso — llegan vía next (build) y postcss.
#  - @grpc/grpc-js: certificados no autorizados aceptados como válidos —
#    llega vía testcontainers > dockerode (solo tests).
#
# IMPORTANTE: los overrides se acotan POR LÍNEA DE VERSIÓN (major). Un override
# abierto (">=X") salta a la major siguiente y rompe a quien consuma la API vieja
# (ej.: minimatch@3 con brace-expansion@5 => "expand is not a function").
overrides:
  postcss@<8.5.18: ">=8.5.18 <9"
  esbuild@<0.28.1: ">=0.28.1 <1"
  undici@8: ">=8.9.0 <9"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@2: ">=2.1.2 <3"
  brace-expansion@5: ">=5.0.12 <6"
  js-yaml@4: ">=4.3.2 <5"
  sharp@<0.35.4: ">=0.35.4 <0.36"
  protobufjs@7: ">=7.6.5 <8"
  browserslist@4: ">=4.28.7 <5"
  nanoid@3: ">=3.3.18 <4"
  baseline-browser-mapping@2: ">=2.11.0 <3"
  "@grpc/grpc-js@1": ">=1.14.5 <2"

# Historial: brace-expansion 1.x (vía minimatch@3, interno de ESLint) fue un
# "riesgo aceptado" hasta que se publicó el backport 1.1.18+ — ya no hace falta.

# Advisory IGNORADO en `pnpm audit` (revisar en cada actualización de ESLint):
#   GHSA-vfj7-8cjw-p6xm — braces: DoS por patrones glob muy anidados.
#   No hay versión parcheada publicada (pide >=3.0.4 y la última es 3.0.3) y
#   llega como transitiva de eslint-config-next > @next/eslint-plugin-next.
#   Es tooling de DESARROLLO y los únicos globs que procesa son los nuestros,
#   así que no hay input de atacante en ese camino. Sin esta exclusión, el job
#   de auditoría del CI quedaría rojo por algo que no podemos arreglar.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
